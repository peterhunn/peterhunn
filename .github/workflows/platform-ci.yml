name: platform-ci

on:
  push:
    branches: [master, main, "claude/**"]
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  typecheck-and-test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # pnpm before Node so setup-node's built-in cache resolver can
      # find the pnpm store. Version pinned to the packageManager
      # field in platform/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      # No lockfile is committed yet (early-phase repo). Fall back to a
      # non-frozen install so the first CI run generates one. Later,
      # once the lockfile is committed, switch to --frozen-lockfile
      # so the build is reproducible and drift is a hard failure.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Migrations aren't committed; drizzle-kit emits them from the
      # authoritative schema. This step must run before test — the
      # in-memory sqlite in every test file applies these on setup.
      - name: Generate DB migrations
        run: pnpm --filter @atelier/db migrate:generate

      - name: Typecheck (turbo)
        run: pnpm typecheck

      - name: Test (turbo)
        run: pnpm test
