name: platform-ci

on:
  push:
    branches: [master, main, "claude/**"]
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  build-and-test:
    name: Typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pnpm before Node so setup-node's built-in cache resolver can
      # find the pnpm store. Version pinned to the packageManager
      # field in platform/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      # No lockfile committed yet (early-phase repo). Fall back to a
      # non-frozen install so the first CI run generates one. First
      # green run should commit pnpm-lock.yaml and flip this flag —
      # after that, drift is a hard failure (which is what we want).
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Migrations aren't committed either; drizzle-kit emits them
      # from the authoritative schema. First green run should commit
      # platform/packages/db/migrations/*.sql and this step becomes
      # a verification (git diff --exit-code after regenerate).
      - name: Generate DB migrations
        run: pnpm --filter @atelier/db migrate:generate

      - name: Typecheck (turbo)
        run: pnpm typecheck

      - name: Test with coverage (turbo)
        env:
          # Force the extractor onto the mock path in CI. Real
          # ANTHROPIC_API_KEY exists only in secrets and must never
          # be exposed to test workflows.
          ANTHROPIC_API_KEY: ""
        run: |
          pnpm test -- \
            --coverage.enabled \
            --coverage.provider=v8 \
            --coverage.reporter=json-summary \
            --coverage.reporter=text

      # Console build gates SSR-only failures that typecheck + test
      # miss. Keeps the deploy pipeline honest.
      - name: Build (turbo)
        run: pnpm build

      # Coverage summary in the run log so PR reviews can see it
      # without leaving GitHub. Codecov integration is a follow-up.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          find . -path '*/coverage/coverage-summary.json' -maxdepth 6 | while read -r f; do
            pkg=$(dirname "$f" | sed 's|.*platform/||; s|/coverage.*||')
            echo "**$pkg**" >> "$GITHUB_STEP_SUMMARY"
            node -e "const d=require('$f').total; console.log(['stmts', 'branches', 'funcs', 'lines'].map(k=>k.padEnd(9)+d[k].pct.toFixed(1)+'%').join('  '))" >> "$GITHUB_STEP_SUMMARY" || true
          done
          echo "(coverage-summary.json emitted by vitest when @vitest/coverage-v8 is installed and --coverage is passed)" >> "$GITHUB_STEP_SUMMARY"
