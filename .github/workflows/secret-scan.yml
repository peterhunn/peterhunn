name: secret-scan

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history scan catches secrets committed on
    # branches that later merged, or long-lived branches that
    # only get pushed occasionally.
    - cron: "17 5 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed for gitleaks-action to leave PR comments.
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so PR scans catch secrets added anywhere
          # in the branch, not just the tip commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: platform/.gitleaks.toml
